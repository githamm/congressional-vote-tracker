name: Scrape Colorado congressional votes

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab, for testing

permissions:
  contents: write

concurrency:
  group: scrape-votes
  # Changed from false: if an earlier run gets stuck (queued or hung), a
  # new trigger now cancels it automatically instead of waiting behind it
  # forever. Safe here since the scraper is idempotent -- restarting a
  # cancelled run just re-does the same work, nothing is lost.
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 'true' when the Congress.gov key secret exists (secrets can't be
      # tested directly in a step's if:).
      HAS_CONGRESS_KEY: ${{ secrets.CONGRESS_API_KEY != '' }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper (incremental)
        id: scrape
        # Writes data/<congress>/all_votes.csv (members come from members.json).
        # --copy-to keeps the root all_votes.csv current for the previously
        # deployed page; drop it once the website runs the new index.html.
        run: python vote_scraper.py --year "$(date -u +%Y)" --incremental --copy-to all_votes.csv

      # Sponsored/cosponsored bills from the Congress.gov API, written to
      # data/<congress>/legislation.json. Needs the CONGRESS_API_KEY
      # repository secret; skipped without it. continue-on-error so an API
      # outage never blocks the vote data from being committed.
      - name: Fetch sponsored and cosponsored bills
        if: env.HAS_CONGRESS_KEY == 'true'
        continue-on-error: true
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
        run: python fetch_legislation.py

      - name: Write job summary
        run: |
          {
            echo "## Vote scrape summary"
            echo ""
            echo "- **New/updated roll calls this run:** ${{ steps.scrape.outputs.new_count }}"
            echo "- **Total roll calls tracked:** ${{ steps.scrape.outputs.total_count }}"
            echo "- **Ran at:** $(date -u +'%Y-%m-%d %H:%M UTC')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add all_votes.csv data/
          if git diff --cached --quiet; then
            echo "No new or corrected roll calls -- nothing to commit."
          else
            git commit -m "Update vote data: ${{ steps.scrape.outputs.new_count }} new/updated (${{ steps.scrape.outputs.total_count }} total) - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # GitHub disables scheduled workflows after 60 days with no repo
      # activity. Long recesses (e.g. Sept-Nov, Dec-Jan) can go that long
      # without a new roll call, so if the newest commit is 50+ days old,
      # push an empty commit to keep the schedule alive.
      - name: Keepalive (prevent 60-day schedule disable)
        if: github.event_name == 'schedule'
        run: |
          last_commit=$(git log -1 --format=%ct)
          age_days=$(( ($(date -u +%s) - last_commit) / 86400 ))
          echo "Last commit was ${age_days} day(s) ago."
          if [ "$age_days" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keepalive: no new votes in ${age_days} days ($(date -u +'%Y-%m-%d'))"
            git push
          fi
